name: Arrangement frå skjemaet

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: arrangement

jobs:
  oppdater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent godkjende arrangement
        run: python3 .github/scripts/arrangement.py
      - name: Commit og push om noko har endra seg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Arrangement frå skjemaet"
            git push
            # Ber Pages byggje på nytt i tilfelle pushen frå boten ikkje gjer det
            gh api -X POST repos/${{ github.repository }}/pages/builds
          fi
